<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Find your photos</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;color:#111;background:#fafafa}
  main{max-width:640px;margin:0 auto;padding:24px 16px}
  h1{margin:0 0 8px}
  #notice{background:#fef9c3;border-radius:8px;padding:10px;font-size:14px;margin:8px 0}
  #cam{margin:16px 0;text-align:center}
  video{width:100%;max-height:60vh;background:#000;border-radius:10px;transform:scaleX(-1);object-fit:cover}
  button,label.btn{display:inline-block;margin-top:12px;padding:14px;width:100%;box-sizing:border-box;font-size:16px;font-weight:600;color:#fff;background:#2563eb;border:0;border-radius:8px;cursor:pointer;text-align:center}
  a.btn{display:block;margin-top:12px;padding:14px;box-sizing:border-box;font-size:16px;font-weight:600;border-radius:8px;text-align:center;text-decoration:none}
  a.btn.alt{background:#fff;color:#2563eb;border:1px solid #2563eb}
  h2{font-size:18px;margin:28px 0 8px}
  button.alt{background:#fff;color:#2563eb;border:1px solid #2563eb}
  #msg{margin:12px 0;min-height:1.2em}
  #msg.err{color:#b91c1c}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  @media(min-width:640px){.grid{grid-template-columns:repeat(4,1fr)}}
  .item img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#e5e5e5;display:block}
  .item a.dl{display:block;font-size:13px;margin-top:4px;color:#2563eb}
  details{margin-top:20px}
  summary{cursor:pointer;color:#555;margin-bottom:8px}
  footer{color:#666;font-size:13px;margin-top:32px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1 id="title">&nbsp;</h1>
  <div id="notice" hidden></div>
  <div id="cam">
    <video id="video" playsinline autoplay muted hidden></video>
    <button id="shoot" hidden>Take selfie</button>
    <div id="fallback" hidden>
      <p>We couldn't open the camera. Choose a photo of your face instead.</p>
      <label class="btn">Choose a photo<input id="file" type="file" accept="image/*" hidden></label>
    </div>
  </div>
  <div id="msg" role="status"></div>
  <div id="results" hidden>
    <div id="count"></div>
    <div class="grid" id="grid"></div>
    <details id="maybeBox" hidden>
      <summary id="maybeSum"></summary>
      <div class="grid" id="maybeGrid"></div>
    </details>
    <button class="alt" id="retake">Retake</button>
  </div>
  <section id="hl" hidden>
    <h2>Highlights</h2>
    <div class="grid" id="hlGrid"></div>
  </section>
  <a class="btn alt" id="viewAll" target="_blank" rel="noopener" hidden>View all photos</a>
  <footer>Your selfie is processed in memory and never stored.</footer>
</main>
<script>
const id = location.pathname.split("/").pop();
const $ = (s) => document.getElementById(s);
let stream = null, hlKey = null;

async function loadInfo() {
  try {
    const d = await (await fetch(`/api/events/${id}`)).json();
    $("title").textContent = d.name || "Find your photos";
    const va = $("viewAll"); va.href = d.folder_url; va.hidden = false;
    const key = d.highlights.map((h) => h.file_id).join();
    if (key !== hlKey) { hlKey = key; fill($("hlGrid"), d.highlights, "Event photo"); $("hl").hidden = !d.highlights.length; }
    const n = $("notice");
    if (d.status === "indexing") { n.hidden = false; n.textContent = `Still processing photos (${d.done}/${d.total}) - results may be incomplete`; }
    else n.hidden = true;
  } catch {}
}

async function startCamera() {
  $("results").hidden = true; $("msg").textContent = ""; $("msg").className = "";
  $("fallback").hidden = true;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return showFallback();
  try {
    stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: "user", width: {ideal: 1280}}, audio: false});
    $("video").srcObject = stream; $("video").hidden = false; $("shoot").hidden = false;
  } catch { showFallback(); }
}
function showFallback() { $("video").hidden = true; $("shoot").hidden = true; $("fallback").hidden = false; }
function stopCamera() {
  if (stream) stream.getTracks().forEach((t) => t.stop());
  stream = null; $("video").srcObject = null; $("video").hidden = true; $("shoot").hidden = true;
}

function toBlob(source, w, h) {
  const s = Math.min(1, 640 / Math.max(w, h));
  const c = document.createElement("canvas");
  c.width = Math.round(w * s); c.height = Math.round(h * s);
  c.getContext("2d").drawImage(source, 0, 0, c.width, c.height);
  return new Promise((res) => c.toBlob(res, "image/jpeg", 0.85));
}

async function send(blob) {
  $("msg").className = ""; $("msg").textContent = "Looking for your photos...";
  const fd = new FormData(); fd.append("selfie", blob, "selfie.jpg");
  try {
    const r = await fetch(`/api/events/${id}/match`, {method: "POST", body: fd});
    const d = await r.json().catch(() => ({}));
    if (r.status === 422) return fail("Couldn't see a face - try again.");
    if (r.status === 429) return fail("Too many tries. Wait a minute and try again.");
    if (!r.ok) return fail(d.detail || "Something went wrong. Try again.");
    show(d.photos, d.maybe || []);
  } catch { fail("Network problem. Try again."); }
}
function fail(m) {
  $("msg").className = "err"; $("msg").textContent = m; $("results").hidden = false;
  $("count").textContent = ""; $("grid").innerHTML = ""; $("maybeBox").hidden = true;
}

// On phones, "Download" goes to the Files app. The share sheet can save straight to Photos.
const canSaveToPhotos = matchMedia("(pointer:coarse)").matches && !!navigator.canShare &&
  navigator.canShare({files: [new File([""], "a.jpg", {type: "image/jpeg"})]});

function saveToPhotos(link, p) {
  let file = null;
  link.textContent = "Save to Photos";
  link.href = "#";
  link.onclick = async (e) => {
    e.preventDefault();
    try {
      if (!file) {
        link.textContent = "Saving...";
        const r = await fetch(`/api/thumb/${id}/${encodeURIComponent(p.file_id)}?s=2048`);
        if (!r.ok) throw new Error("fetch");
        file = new File([await r.blob()], p.name || "photo.jpg", {type: "image/jpeg"});
      }
      await navigator.share({files: [file]});
      link.textContent = "Save to Photos";
    } catch (err) {
      if (err.name === "AbortError") link.textContent = "Save to Photos";          // user closed the sheet
      else if (file && err.name === "NotAllowedError") link.textContent = "Tap again to save";  // tap expired while loading
      else { link.textContent = "Download"; link.onclick = null; link.href = `https://drive.google.com/uc?export=download&id=${encodeURIComponent(p.file_id)}`; }
    }
  };
}

function fill(grid, photos, alt = "Photo of you") {
  grid.innerHTML = "";
  for (const p of photos) {
    const fid = encodeURIComponent(p.file_id);
    const d = document.createElement("div"); d.className = "item";
    const a = document.createElement("a");
    a.href = `https://drive.google.com/file/d/${fid}/view`; a.target = "_blank"; a.rel = "noopener";
    const img = document.createElement("img");
    img.loading = "lazy"; img.alt = alt; img.src = `/api/thumb/${id}/${fid}`;
    a.appendChild(img);
    const dl = document.createElement("a");
    dl.className = "dl"; dl.textContent = "Download"; dl.href = `https://drive.google.com/uc?export=download&id=${fid}`;
    if (canSaveToPhotos) saveToPhotos(dl, p);
    d.append(a, dl); grid.appendChild(d);
  }
}

function show(photos, maybe) {
  $("msg").textContent = ""; $("results").hidden = false;
  const none = !photos.length && !maybe.length;
  $("count").textContent = photos.length ? `Found you in ${photos.length} photo${photos.length === 1 ? "" : "s"}`
    : none ? "No photos found. Try another selfie with good light, facing the camera."
    : "No sure matches. These might be you:";
  fill($("grid"), photos);
  const box = $("maybeBox");
  box.hidden = !maybe.length;
  box.open = !photos.length;  // nothing else to show: open it
  $("maybeSum").textContent = `Might be you (${maybe.length})`;
  fill($("maybeGrid"), maybe);
}

$("shoot").onclick = async () => {
  const v = $("video");
  const blob = await toBlob(v, v.videoWidth, v.videoHeight);  // unmirrored: CSS flip only affects display
  stopCamera(); send(blob);
};
$("file").onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const bmp = await createImageBitmap(f);
    send(await toBlob(bmp, bmp.width, bmp.height));
  } catch { fail("Couldn't read that photo."); }
  e.target.value = "";
};
$("retake").onclick = startCamera;

loadInfo(); setInterval(loadInfo, 5000);
startCamera();
</script>
</body>
</html>
