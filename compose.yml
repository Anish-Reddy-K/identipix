services:
  app:
    build: .
    env_file: .env
    volumes: ["identipix-data:/data"]
    ports: ["127.0.0.1:8080:8080"]   # this machine only; the public goes through the tunnel
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: &log
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      app: {condition: service_healthy}
    restart: unless-stopped
    logging: *log

volumes:
  identipix-data:
